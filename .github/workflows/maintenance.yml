name: Blog Maintenance

on:
  schedule:
    # Ejecutar limpieza diaria a las 2:00 AM UTC
    - cron: '0 2 * * *'
    # Health check cada 6 horas
    - cron: '0 */6 * * *'
  
  # También permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    
    steps:
    - name: Maintenance Task with Retry
      run: |
        echo "🧹 Ejecutando mantenimiento del blog..."
        
        # Función de reintento
        retry_request() {
          local url=$1
          local max_attempts=3
          local attempt=1
          
          while [ $attempt -le $max_attempts ]; do
            echo "Intento $attempt de $max_attempts..."
            
            response=$(curl -L -s -w "%{http_code}" -X POST \
              "$url" \
              -H "Authorization: Bearer ${{ secrets.MAINTENANCE_TOKEN }}" \
              -H "Content-Type: application/json" \
              --connect-timeout 30 \
              --max-time 60)
            
            http_code="${response: -3}"
            body="${response%???}"
            
            echo "HTTP Status: $http_code"
            
            if [ "$http_code" -eq 200 ]; then
              echo "✅ Mantenimiento completado exitosamente"
              echo "Response: $body"
              return 0
            else
              echo "❌ Error en intento $attempt (HTTP $http_code)"
              echo "Response: $body"
              
              if [ $attempt -lt $max_attempts ]; then
                echo "⏳ Esperando 10 segundos antes del siguiente intento..."
                sleep 10
              fi
            fi
            
            attempt=$((attempt + 1))
          done
          
          echo "❌ Mantenimiento falló después de $max_attempts intentos"
          return 1
        }
        
        # Ejecutar con reintentos
        retry_request "https://www.delrio.dev/api/maintenance"

    - name: Health Check
      run: |
        echo "🔍 Verificando salud del sistema..."
        
        # Verificar que el sistema esté funcionando
        response=$(curl -L -s -w "%{http_code}" \
          "https://www.delrio.dev/api/health")
        
        http_code="${response: -3}"
        body="${response%???}"
        
        echo "HTTP Status: $http_code"
        echo "Health Response: $body"
        
        if [ "$http_code" -eq 200 ]; then
          status=$(echo "$body" | jq -r '.status' 2>/dev/null || echo "unknown")
          if [ "$status" = "healthy" ]; then
            echo "✅ Sistema saludable"
          else
            echo "⚠️ Sistema con problemas: $status"
            echo "$body" | jq '.issues' 2>/dev/null || echo "No se pudieron obtener detalles"
          fi
        else
          echo "❌ Health check falló"
          exit 1
        fi